[build]
buildCommand = "npm install --prefer-offline --no-audit --no-fund && npm run db:generate && npm run build"

[deploy]
preDeployCommand = "npm run db:deploy:runtime && npm run db:seed:runtime"
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
