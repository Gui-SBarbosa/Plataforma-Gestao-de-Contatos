services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestcon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gestcon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestcon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestcon-postgres-data:
