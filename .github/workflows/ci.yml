name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestcon_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d gestcon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ORIGIN: http://localhost:5173
      CSRF_SECRET: test-csrf-secret-with-at-least-thirty-two-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestcon_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gestcon_test?schema=public
      NODE_ENV: test
      RATE_LIMIT_SECRET: test-rate-limit-secret-with-at-least-thirty-two-characters
      SESSION_SECRET: test-session-secret-with-at-least-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply test migrations
        run: npm run db:deploy:runtime

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:integration

      - name: Build
        run: npm run build
